<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Terminal | Pro Screener</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP for smooth load -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Google Fonts for Trading Look (Inter for Text, JetBrains Mono for Numbers) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        tv_bg: '#131722',
                        tv_card: '#1e222d',
                        tv_border: '#2a2e39',
                        tv_text: '#d1d4dc',
                        tv_muted: '#787b86',
                        tv_green: '#089981',
                        tv_red: '#f23645',
                        tv_blue: '#2962ff'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #131722; color: #d1d4dc; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #131722; }
        ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #787b86; }
        
        /* Ticker Animation */
        .ticker-wrap { overflow: hidden; white-space: nowrap; box-sizing: border-box; }
        .ticker { display: inline-block; animation: ticker 25s linear infinite; }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body class="antialiased flex flex-col h-screen overflow-hidden">

    <!-- Top Navigation / Ticker Bar -->
    <div class="w-full bg-tv_card border-b border-tv_border h-10 flex items-center px-4 text-xs font-mono text-tv_muted">
        <div class="flex items-center space-x-2 mr-6 text-white font-bold tracking-widest bg-tv_blue px-3 py-1 rounded-sm">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
            <span>TERMINAL</span>
        </div>
        <div class="ticker-wrap flex-1 border-l border-tv_border pl-4 overflow-hidden">
            <div class="ticker" id="ticker-content">
                <!-- Ticker data will be injected here -->
                Loading Market Data...
            </div>
        </div>
        <div class="ml-4 pl-4 border-l border-tv_border shrink-0 flex items-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span id="time-display">--:--:--</span>
        </div>
    </div>

    <!-- Main Dashboard Area -->
    <div class="flex-1 overflow-auto p-4 md:p-6 gs-reveal">
        
        <!-- Header Section -->
        <div class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Breakout Screener <span class="text-tv_blue">v2.0</span></h1>
                <p class="text-sm text-tv_muted mt-1">Multi-Timeframe Volume & Delivery Expansion</p>
            </div>
            <div class="hidden md:flex space-x-2">
                <button class="bg-tv_card border border-tv_border text-tv_text px-4 py-2 text-sm font-semibold hover:bg-tv_border transition flex items-center">
                    <svg class="w-4 h-4 mr-2 text-tv_blue" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3a2 2 0 100 4h12a2 2 0 100-4H4zM4 9a2 2 0 100 4h12a2 2 0 100-4H4zM4 15a2 2 0 100 4h12a2 2 0 100-4H4z"></path></svg>
                    Filter
                </button>
                <button class="bg-tv_blue text-white px-4 py-2 text-sm font-semibold hover:bg-blue-700 transition flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export CSV
                </button>
            </div>
        </div>

        <!-- Metrics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <!-- Card 1 -->
            <div class="bg-tv_card border border-tv_border p-4 hover:border-tv_muted transition cursor-default">
                <div class="text-xs text-tv_muted font-semibold uppercase mb-1">Market Sentiment</div>
                <div class="text-2xl font-mono text-tv_green font-bold flex items-center">
                    BULLISH <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
            </div>
            <!-- Card 2 -->
            <div class="bg-tv_card border border-tv_border p-4 hover:border-tv_muted transition cursor-default">
                <div class="text-xs text-tv_muted font-semibold uppercase mb-1">Total Breakouts</div>
                <div class="text-2xl font-mono text-white font-bold" id="total-breakouts">--</div>
            </div>
            <!-- Card 3 -->
            <div class="bg-tv_card border border-tv_border p-4 hover:border-tv_muted transition cursor-default">
                <div class="text-xs text-tv_muted font-semibold uppercase mb-1">Leading Sector</div>
                <div class="text-lg font-bold text-white truncate" id="top-sector-name">--</div>
                <div class="text-xs font-mono text-tv_blue mt-1" id="top-sector-ratio">--</div>
            </div>
            <!-- Card 4 -->
            <div class="bg-tv_card border border-tv_border p-4 hover:border-tv_muted transition cursor-default">
                <div class="text-xs text-tv_muted font-semibold uppercase mb-1">Top Volume Mover</div>
                <div class="text-lg font-mono font-bold text-tv_green" id="top-stock-name">--</div>
                <div class="text-xs font-mono text-tv_muted mt-1" id="top-stock-ratio">--</div>
            </div>
        </div>

        <!-- Trading Table -->
        <div class="bg-tv_card border border-tv_border flex-1">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="border-b border-tv_border text-xs text-tv_muted uppercase font-semibold">
                            <th class="px-6 py-3 font-medium">Symbol</th>
                            <th class="px-6 py-3 font-medium">Sector</th>
                            <th class="px-6 py-3 font-medium text-right">Vol Expansion</th>
                            <th class="px-6 py-3 font-medium text-right">Del Expansion</th>
                            <th class="px-6 py-3 font-medium text-center">Setup</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-sm">
                        <!-- JS Injected Rows -->
                        <tr><td colspan="5" class="px-6 py-8 text-center text-tv_muted">Initializing terminal data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Animations
        gsap.from(".gs-reveal", { y: 20, opacity: 0, duration: 0.6, ease: "power2.out" });

        // Update real-time clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('time-display').innerText = now.toLocaleTimeString('en-US', { hour12: false });
        }, 1000);

        // Fetch JSON Data
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                
                // Update Cards
                document.getElementById('total-breakouts').innerText = data.total_breakouts;
                
                if(data.top_sectors.length > 0) {
                    document.getElementById('top-sector-name').innerText = data.top_sectors[0].Sector;
                    document.getElementById('top-sector-ratio').innerText = "Delivery " + data.top_sectors[0].Sector_Del_Ratio.toFixed(2) + "x";
                    
                    // Create Ticker String
                    let tickerStr = "";
                    data.top_sectors.forEach(s => {
                        tickerStr += `<span class="text-tv_muted mr-2">SECTOR:</span><span class="text-white font-bold mr-2">${s.Sector.toUpperCase()}</span><span class="text-tv_green mr-8">▲ ${s.Sector_Del_Ratio.toFixed(2)}x</span>`;
                    });
                    document.getElementById('ticker-content').innerHTML = tickerStr + tickerStr; // Duplicate for smooth infinite scroll
                }
                
                if(data.stocks.length > 0) {
                    // Sort by volume for the Top Volume Mover card
                    let highestVolStock = [...data.stocks].sort((a,b) => b.Vol_Ratio - a.Vol_Ratio)[0];
                    document.getElementById('top-stock-name').innerText = highestVolStock.SYMBOL;
                    document.getElementById('top-stock-ratio').innerText = "Vol: " + highestVolStock.Vol_Ratio.toFixed(2) + "x";
                }

                // Populate Table
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = ""; 
                
                data.stocks.forEach((stock, index) => {
                    // TradingView specific formatting
                    let isTopTier = index < 3;
                    let tagClass = isTopTier ? "bg-[#089981]/20 text-[#089981] border border-[#089981]/50" : "bg-tv_border text-tv_text";
                    let tagText = isTopTier ? "STRONG BUY" : "BREAKOUT";

                    const tr = document.createElement('tr');
                    tr.className = "border-b border-tv_border hover:bg-[#2a2e39] transition duration-150";
                    
                    tr.innerHTML = `
                        <td class="px-6 py-2">
                            <div class="flex items-center">
                                <div class="w-6 h-6 rounded bg-[#2a2e39] text-tv_muted flex items-center justify-center text-xs mr-3 border border-tv_border">EQ</div>
                                <span class="font-mono font-bold text-tv_blue cursor-pointer hover:underline">${stock.SYMBOL}</span>
                            </div>
                        </td>
                        <td class="px-6 py-2 text-tv_text text-xs">${stock.Sector}</td>
                        <td class="px-6 py-2 text-right font-mono">
                            <span class="${stock.Vol_Ratio > 10 ? 'text-tv_green font-bold' : 'text-tv_text'}">
                                ${stock.Vol_Ratio.toFixed(2)}x
                            </span>
                        </td>
                        <td class="px-6 py-2 text-right font-mono">
                            <span class="${stock.Del_Ratio > 5 ? 'text-tv_green font-bold' : 'text-tv_text'}">
                                ${stock.Del_Ratio.toFixed(2)}x
                            </span>
                        </td>
                        <td class="px-6 py-2 text-center">
                            <span class="${tagClass} px-2 py-1 text-[10px] font-bold tracking-wider rounded-sm">${tagText}</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(error => {
                console.error("Error fetching data:", error);
                document.getElementById('table-body').innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-tv_red font-mono">Connection Error: data.json not found.</td></tr>`;
            });
    </script>
</body>
</html>
