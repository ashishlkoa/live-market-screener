name: Daily Market Screener Automation

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    
    # === NAYA ADD KIYA: SERVER KO INDIA TIME PAR SET KARNE KE LIYE ===
    env:
      TZ: 'Asia/Kolkata'
    # ================================================================

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Screener Script
      run: python screener.py

    - name: Commit and Push Updated Data
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data.json Breakout_Analysis_*.xlsx
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated daily market data update"
        git push
