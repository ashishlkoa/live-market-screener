name: Daily Market Screener Automation

on:
  schedule:
    # Yeh roz shaam 6:30 PM IST (13:00 UTC) par chalega, Monday to Friday
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Button dabakar manual run karne ke liye

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Screener Script
      run: python screener.py

    - name: Commit and Push Updated Data
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data.json Breakout_Analysis_*.xlsx
        # Agar naya data hai toh hi commit karega
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated daily market data update"
        git push
